<svg width="100%" viewBox="0 0 680 980" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Vista 3 – Flujo de datos del agente MBE</title>
  <desc>Diagrama en capas que muestra el flujo completo desde la query del usuario hasta la respuesta generada por el LLM, pasando por embedding, búsqueda FAISS y Groq API.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, sans-serif; }
      .th  { font-size: 14px; font-weight: 500; fill: #0C447C; }
      .ts  { font-size: 12px; font-weight: 400; fill: #185FA5; }
      .tsg { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
      .tsl { font-size: 12px; font-weight: 400; fill: #888780; }

      /* Purple – Presentación */
      .c-purple rect  { fill: #EEEDFE; stroke: #534AB7; }
      .c-purple .th   { fill: #3C3489; }
      .c-purple .ts   { fill: #534AB7; }

      /* Teal – Retrieve */
      .c-teal rect    { fill: #E1F5EE; stroke: #0F6E56; }
      .c-teal .th     { fill: #085041; }
      .c-teal .ts     { fill: #0F6E56; }

      /* Coral – Generate */
      .c-coral rect   { fill: #FAECE7; stroke: #993C1D; }
      .c-coral .th    { fill: #712B13; }
      .c-coral .ts    { fill: #993C1D; }

      /* Blue – Datos */
      .c-blue rect    { fill: #E6F1FB; stroke: #185FA5; }
      .c-blue .th     { fill: #0C447C; }
      .c-blue .ts     { fill: #185FA5; }

      /* Gray – Logger / SQLite */
      .c-gray rect    { fill: #F1EFE8; stroke: #5F5E5A; }
      .c-gray .th     { fill: #444441; }
      .c-gray .ts     { fill: #5F5E5A; }

      .arr { stroke: #888780; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <!-- ══════════════════════════════════════════════
       CAPA 1 – PRESENTACIÓN
  ════════════════════════════════════════════════ -->
  <text class="tsl" x="18" y="104" text-anchor="middle" transform="rotate(-90,18,104)">Presentación</text>
  <rect x="30" y="30" width="620" height="100" rx="14" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Usuario -->
  <g class="c-purple">
    <rect x="52" y="52" width="120" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="112" y="76" text-anchor="middle" dominant-baseline="central">Usuario</text>
    <text class="ts" x="112" y="94" text-anchor="middle" dominant-baseline="central">Escribe query</text>
  </g>

  <!-- Streamlit UI -->
  <g class="c-purple">
    <rect x="220" y="52" width="160" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="300" y="76" text-anchor="middle" dominant-baseline="central">Streamlit UI</text>
    <text class="ts" x="300" y="94" text-anchor="middle" dominant-baseline="central">Auth · sesión · chat</text>
  </g>

  <!-- Logger / SQLite -->
  <g class="c-gray">
    <rect x="440" y="52" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="530" y="76" text-anchor="middle" dominant-baseline="central">Logger · SQLite</text>
    <text class="ts" x="530" y="94" text-anchor="middle" dominant-baseline="central">Latencias · chunks · scores</text>
  </g>

  <line x1="172" y1="80" x2="218" y2="80" class="arr" marker-end="url(#arrow)"/>
  <text class="tsl" x="195" y="72" text-anchor="middle">query</text>

  <!-- ══════════════════════════════════════════════
       CAPA 2 – LÓGICA RAG
  ════════════════════════════════════════════════ -->
  <text class="tsl" x="18" y="440" text-anchor="middle" transform="rotate(-90,18,440)">Lógica RAG</text>
  <rect x="30" y="155" width="620" height="550" rx="14" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- LangGraph contenedor interno -->
  <rect x="48" y="170" width="584" height="520" rx="10" fill="none" stroke="#D3D1C7" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text class="tsl" x="340" y="188" text-anchor="middle">LangGraph — grafo de estados</text>

  <!-- NODO RETRIEVE -->
  <rect x="64" y="200" width="552" height="200" rx="8" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>
  <text class="tsl" x="340" y="216" text-anchor="middle">retrieval_node</text>

  <g class="c-teal">
    <rect x="80" y="226" width="170" height="70" rx="8" stroke-width="0.5"/>
    <text class="th" x="165" y="251" text-anchor="middle" dominant-baseline="central">Encode query</text>
    <text class="ts" x="165" y="271" text-anchor="middle" dominant-baseline="central">MiniLM-L12-v2</text>
    <text class="ts" x="165" y="286" text-anchor="middle" dominant-baseline="central">→ vector 384 dim.</text>
  </g>

  <g class="c-teal">
    <rect x="290" y="226" width="160" height="70" rx="8" stroke-width="0.5"/>
    <text class="th" x="370" y="251" text-anchor="middle" dominant-baseline="central">FAISS search</text>
    <text class="ts" x="370" y="271" text-anchor="middle" dominant-baseline="central">index.search(q_emb, 3)</text>
    <text class="ts" x="370" y="286" text-anchor="middle" dominant-baseline="central">→ scores + idxs</text>
  </g>

  <g class="c-teal">
    <rect x="494" y="226" width="106" height="70" rx="8" stroke-width="0.5"/>
    <text class="th" x="547" y="251" text-anchor="middle" dominant-baseline="central">Contexto</text>
    <text class="ts" x="547" y="271" text-anchor="middle" dominant-baseline="central">Top-3 chunks</text>
    <text class="ts" x="547" y="286" text-anchor="middle" dominant-baseline="central">con score</text>
  </g>

  <line x1="250" y1="261" x2="288" y2="261" class="arr" marker-end="url(#arrow)"/>
  <text class="tsl" x="269" y="253" text-anchor="middle">emb.</text>
  <line x1="450" y1="261" x2="492" y2="261" class="arr" marker-end="url(#arrow)"/>
  <text class="tsl" x="471" y="253" text-anchor="middle">rows</text>

  <text class="tsl" x="340" y="366" text-anchor="middle">state["context"] = "ARTÍCULO 12 - Título\nTexto…"</text>

  <!-- NODO GENERATE -->
  <rect x="64" y="390" width="552" height="200" rx="8" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>
  <text class="tsl" x="340" y="406" text-anchor="middle">generation_node</text>

  <g class="c-coral">
    <rect x="80" y="416" width="170" height="70" rx="8" stroke-width="0.5"/>
    <text class="th" x="165" y="441" text-anchor="middle" dominant-baseline="central">Prompt assembly</text>
    <text class="ts" x="165" y="461" text-anchor="middle" dominant-baseline="central">query + contexto</text>
    <text class="ts" x="165" y="476" text-anchor="middle" dominant-baseline="central">+ system prompt</text>
  </g>

  <g class="c-coral">
    <rect x="298" y="416" width="160" height="70" rx="8" stroke-width="0.5"/>
    <text class="th" x="378" y="441" text-anchor="middle" dominant-baseline="central">Groq API call</text>
    <text class="ts" x="378" y="461" text-anchor="middle" dominant-baseline="central">llama-3.1-8b-instant</text>
    <text class="ts" x="378" y="476" text-anchor="middle" dominant-baseline="central">temp=0.2 · max=1300</text>
  </g>

  <g class="c-coral">
    <rect x="506" y="416" width="94" height="70" rx="8" stroke-width="0.5"/>
    <text class="th" x="553" y="441" text-anchor="middle" dominant-baseline="central">SSE stream</text>
    <text class="ts" x="553" y="461" text-anchor="middle" dominant-baseline="central">yield token</text>
    <text class="ts" x="553" y="476" text-anchor="middle" dominant-baseline="central">por token</text>
  </g>

  <line x1="250" y1="451" x2="296" y2="451" class="arr" marker-end="url(#arrow)"/>
  <line x1="458" y1="451" x2="504" y2="451" class="arr" marker-end="url(#arrow)"/>

  <!-- Flecha retrieve → generate -->
  <line x1="340" y1="316" x2="340" y2="370" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="tsl" x="355" y="346">context</text>

  <!-- Flecha generate → logger -->
  <path d="M600 451 Q640 451 640 80 L622 80" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="tsl" x="648" y="270" text-anchor="middle" transform="rotate(90,648,270)">meta · lat.</text>

  <!-- ══════════════════════════════════════════════
       CAPA 3 – DATOS
  ════════════════════════════════════════════════ -->
  <text class="tsl" x="18" y="810" text-anchor="middle" transform="rotate(-90,18,810)">Datos</text>
  <rect x="30" y="730" width="620" height="220" rx="14" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="6 4"/>

  <g class="c-blue">
    <rect x="52" y="756" width="140" height="70" rx="8" stroke-width="0.5"/>
    <text class="th" x="122" y="783" text-anchor="middle" dominant-baseline="central">CSV corpus</text>
    <text class="ts" x="122" y="801" text-anchor="middle" dominant-baseline="central">articulos_total.csv</text>
    <text class="ts" x="122" y="816" text-anchor="middle" dominant-baseline="central">id · título · texto</text>
  </g>

  <g class="c-blue">
    <rect x="230" y="756" width="155" height="70" rx="8" stroke-width="0.5"/>
    <text class="th" x="307" y="783" text-anchor="middle" dominant-baseline="central">Embeddings</text>
    <text class="ts" x="307" y="801" text-anchor="middle" dominant-baseline="central">embeddings_total.npy</text>
    <text class="ts" x="307" y="816" text-anchor="middle" dominant-baseline="central">float32 · 384 dim.</text>
  </g>

  <g class="c-blue">
    <rect x="420" y="756" width="140" height="70" rx="8" stroke-width="0.5"/>
    <text class="th" x="490" y="783" text-anchor="middle" dominant-baseline="central">Índice FAISS</text>
    <text class="ts" x="490" y="801" text-anchor="middle" dominant-baseline="central">faiss_index_total.bin</text>
    <text class="ts" x="490" y="816" text-anchor="middle" dominant-baseline="central">búsqueda coseno</text>
  </g>

  <g class="c-gray">
    <rect x="52" y="856" width="508" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="306" y="882" text-anchor="middle" dominant-baseline="central">SQLite — mbe_logs.db</text>
    <text class="ts" x="306" y="900" text-anchor="middle" dominant-baseline="central">query · chunks · scores · lat_embedding · lat_retrieval · lat_llm</text>
  </g>

  <!-- ══════════════════════════════════════════════
       FLECHAS ENTRE CAPAS
  ════════════════════════════════════════════════ -->

  <!-- Streamlit → LangGraph -->
  <line x1="300" y1="108" x2="300" y2="153" class="arr" marker-end="url(#arrow)"/>
  <text class="tsl" x="315" y="134">query</text>

  <!-- SSE tokens suben a Streamlit -->
  <path d="M553 486 Q553 600 220 600 Q80 600 80 130 L80 108" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="tsl" x="420" y="594">tokens SSE</text>

  <!-- Retrieve → Datos (FAISS) -->
  <line x1="370" y1="626" x2="370" y2="728" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="tsl" x="386" y="685">read</text>

  <!-- Encode query → Datos (embeddings) -->
  <line x1="165" y1="616" x2="165" y2="728" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- ══════════════════════════════════════════════
       LEYENDA
  ════════════════════════════════════════════════ -->
  <line x1="52" y1="950" x2="90" y2="950" class="arr" marker-end="url(#arrow)"/>
  <text class="tsg" x="96" y="954">flujo principal</text>

  <line x1="220" y1="950" x2="258" y2="950" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow)"/>
  <text class="tsg" x="264" y="954">flujo de retorno / lectura</text>

</svg>
