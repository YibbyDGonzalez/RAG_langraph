services:

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: mbe-app:latest
    ports:
      - "8501:8501"
    volumes:
      # Los datos (FAISS index + CSV) se montan en modo lectura
      - ./data:/app/data:ro
      # Logs en su propio mount con escritura habilitada
      - ./data/logs:/app/data/logs
      # Logo de la Javeriana accesible en el contenedor sin rebuild
      - ./Javeriana.png:/app/Javeriana.png:ro
      # Usuarios para autenticacion (editable sin rebuild)
      - ./users.yaml:/app/users.yaml:ro
    env_file:
      - .env
