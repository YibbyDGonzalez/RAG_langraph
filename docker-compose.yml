services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    image: mbe-ollama:latest
    ports:
      - "11434:11434"
    volumes:
      # El modelo vive aqui: se descarga una vez y persiste entre reinicios
      - ollama_models:/root/.ollama
    healthcheck:
      # Usa el CLI de ollama (siempre disponible en la imagen) en vez de curl
      # Verifica que el servidor responde sin depender de herramientas externas
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: mbe-app:latest
    ports:
      - "8501:8501"
    volumes:
      # Los datos (FAISS index + CSV) se montan en modo lectura
      - ./data:/app/data:ro
      # Logs en su propio mount con escritura habilitada
      - ./data/logs:/app/data/logs
      # Logo de la Javeriana accesible en el contenedor sin rebuild
      - ./Javeriana.png:/app/Javeriana.png:ro
      # Usuarios para autenticacion (editable sin rebuild)
      - ./users.yaml:/app/users.yaml:ro
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_models: # volumen nombrado — persiste el modelo entre reinicios
