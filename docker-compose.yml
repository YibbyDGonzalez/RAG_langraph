services:

  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    image: mbe-ollama:latest
    ports:
      - "11434:11434"
    volumes:
      # El modelo vive aquí: se descarga una vez y persiste entre reinicios
      - ollama_models:/root/.ollama
    healthcheck:
      # Espera a que el modelo esté disponible (no solo el servidor)
      test: ["CMD-SHELL", "ollama list 2>/dev/null | grep -q 'llama3.2'"]
      interval: 20s
      timeout: 10s
      retries: 60        # hasta 20 min de paciencia en la primera descarga
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: mbe-app:latest
    ports:
      - "8501:8501"
    volumes:
      # Los datos (FAISS index + CSV) se montan para poder actualizarlos
      # sin reconstruir la imagen
      - ./data:/app/data:ro
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_models:    # volumen nombrado — persiste el modelo entre reinicios
